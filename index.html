<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tankomat PRO 🚀</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b1220;
  color:white;
}

header {
  background: linear-gradient(90deg,#00c6ff,#00ff88);
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

#map { height:250px; }

button {
  width:90%;
  margin:8px auto;
  display:block;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#00cc66;
  color:white;
  font-size:16px;
}

.card {
  background:#111a2e;
  margin:10px;
  padding:12px;
  border-radius:10px;
}

.best { border:2px solid #00ff88; }
.favorite { border:2px solid gold; }
</style>

</head>

<body>

<header>🚀 Tankomat PRO</header>

<div id="map"></div>

<button onclick="loadData()">🔄 Aktualisieren</button>

<div id="list">Lade Daten...</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map;
let userLat = 52.18;
let userLng = 10.97;

const API_URL = "https://mtqnxdwbwpvdzrblxpsz.supabase.co/functions/v1/dynamic-worker";

let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");

function toggleFavorite(id){
  if(favorites.includes(id)){
    favorites = favorites.filter(f=>f!==id);
  } else {
    favorites.push(id);
  }
  localStorage.setItem("favorites", JSON.stringify(favorites));
  loadData();
}

// 📍 Standort
function getLocation(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      initMap();
      loadData();
    }, ()=>{
      initMap();
      loadData();
    });
  } else {
    initMap();
    loadData();
  }
}

// 🗺️ Map
function initMap(){
  map = L.map('map').setView([userLat, userLng], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  L.marker([userLat, userLng]).addTo(map)
    .bindPopup("📍 Du bist hier")
    .openPopup();
}

// 🔥 LOAD DATA (STABIL)
async function loadData(){
  try{
    const res = await fetch(`${API_URL}?lat=${userLat}&lng=${userLng}`);
    const data = await res.json();

    console.log("API DATA:", data);

    if(!data.stations){
      document.getElementById("list").innerHTML = "❌ Keine Daten (API Problem)";
      return;
    }

    // DETAILS HOLEN
    for (let s of data.stations.slice(0,10)){
      try{
        const d = await fetch(`${API_URL}?detail=${s.id}`);
        const detail = await d.json();

        if(detail.station){
          s.diesel = detail.station.diesel;
          s.e5 = detail.station.e5;
          s.e10 = detail.station.e10;
        }
      }catch(e){}
    }

    renderList(data.stations);

  }catch(e){
    console.error(e);
    document.getElementById("list").innerHTML = "❌ Fehler beim Laden";
  }
}

// 📦 LISTE
function renderList(stations){
  const list = document.getElementById("list");
  list.innerHTML = "";

  if(!stations || stations.length === 0){
    list.innerHTML = "❌ Keine Tankstellen gefunden";
    return;
  }

  stations.sort((a,b)=>{
    const aFav = favorites.includes(a.id);
    const bFav = favorites.includes(b.id);
    return bFav - aFav || a.price - b.price;
  });

  let best = stations[0];

  stations.forEach(s=>{
    const isFav = favorites.includes(s.id);

    const div = document.createElement("div");
    div.className = "card " + (best.id === s.id ? "best " : "") + (isFav ? "favorite" : "");

    div.innerHTML = `
      ${best.id === s.id ? "🏆 BESTER PREIS<br><br>" : ""}

      <b>${s.name}</b><br>
      ${s.place}<br><br>

      ⛽ Diesel: ${s.diesel != null ? s.diesel + " €" : "nicht verfügbar"}<br>
      ${s.e5 != null ? "🟢 E5: " + s.e5 + " €<br>" : ""}
      ${s.e10 != null ? "🔵 E10: " + s.e10 + " €<br>" : ""}

      <br>📍 ${s.dist} km<br><br>

      <button onclick="navigate(${s.lat},${s.lng})">🧭 Navigation</button>
      <button onclick="toggleFavorite('${s.id}')">
        ${isFav ? "⭐ Entfernen" : "⭐ Favorit"}
      </button>
    `;

    list.appendChild(div);
    L.marker([s.lat, s.lng]).addTo(map);
  });
}

// 🧭 NAVI
function navigate(lat,lng){
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`);
}

getLocation();
</script>

</body>
</html>
