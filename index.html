<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tankomat PRO 🚀</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b1220;
  color:white;
}

header {
  background: linear-gradient(90deg,#00c6ff,#00ff88);
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

#map { height:250px; }

button {
  width:90%;
  margin:10px auto;
  display:block;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#00cc66;
  color:white;
  font-size:16px;
}

.card {
  background:#111a2e;
  margin:10px;
  padding:12px;
  border-radius:10px;
}

.best { border:2px solid #00ff88; }

.alert {
  border:2px solid red;
  box-shadow:0 0 10px red;
}
</style>

</head>

<body>

<header>🚀 Tankomat PRO</header>

<div id="map"></div>

<button onclick="loadData()">🔄 Aktualisieren</button>

<div id="list">🔄 Lade Daten...</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map;
let userLat = 52.18;
let userLng = 10.97;

const API_URL = "https://mtqnxdwbwpvdzrblxpsz.supabase.co/functions/v1/dynamic-worker";

// 🔥 Preisalarm Grenze
const ALERT_PRICE = 2.05;

// 📍 Standort
function getLocation(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      initMap();
      loadData();
    }, ()=>{
      initMap();
      loadData();
    });
  } else {
    initMap();
    loadData();
  }
}

// 🗺️ Karte
function initMap(){
  map = L.map('map').setView([userLat, userLng], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  L.marker([userLat, userLng]).addTo(map)
    .bindPopup("📍 Du bist hier")
    .openPopup();
}

// 🔥 Daten laden
async function loadData(){
  const list = document.getElementById("list");
  list.innerHTML = "🔄 Lade Tankstellen...";

  try{
    const res = await fetch(`${API_URL}?lat=${userLat}&lng=${userLng}`);
    const data = await res.json();

    if(!data.stations){
      list.innerHTML = "❌ Keine Daten";
      return;
    }

    // 👉 NUR TOP 10 holen Details (Performance!)
    const stations = data.stations;

    for (let s of stations.slice(0,10)){
      try{
        const d = await fetch(`${API_URL}?detail=${s.id}`);
        const detail = await d.json();

        if(detail.station){
          s.diesel = detail.station.diesel;
          s.e5 = detail.station.e5;
          s.e10 = detail.station.e10;
        }
      }catch(e){}
    }

    renderList(stations);

  }catch(e){
    console.error(e);
    list.innerHTML = "❌ Fehler beim Laden";
  }
}

// 📦 Anzeige
function renderList(stations){
  const list = document.getElementById("list");
  list.innerHTML = "";

  stations.sort((a,b)=>a.price - b.price);

  const best = stations[0];

  stations.forEach(s=>{

    // 🔥 fallback
    const diesel = s.diesel ?? s.price ?? null;

    const isBest = s.id === best.id;
    const isAlert = diesel && diesel <= ALERT_PRICE;

    const div = document.createElement("div");
    div.className = "card " + (isBest ? "best " : "") + (isAlert ? "alert" : "");

    div.innerHTML = `
      ${isBest ? "🏆 BESTER PREIS<br><br>" : ""}
      ${isAlert ? "🚨 PREISALARM!<br><br>" : ""}

      <b>${s.name}</b><br>
      ${s.place}<br><br>

      ⛽ Diesel: ${diesel ? diesel + " €" : "nicht verfügbar"}<br>

      ${s.e5 != null ? "🟢 E5: " + s.e5 + " €<br>" : ""}
      ${s.e10 != null ? "🔵 E10: " + s.e10 + " €<br>" : ""}

      <br>📍 ${s.dist} km<br><br>

      <button onclick="navigate(${s.lat},${s.lng})">🧭 Navigation</button>
    `;

    list.appendChild(div);

    L.marker([s.lat, s.lng]).addTo(map);
  });
}

// 🧭 Navi
function navigate(lat,lng){
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`);
}

// 🔄 Auto Refresh
setInterval(loadData, 60000);

getLocation();

</script>

</body>
</html>
