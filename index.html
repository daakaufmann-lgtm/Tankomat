<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diesel AI GOD MODE</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b1320;
  color:white;
}

header {
  background:linear-gradient(90deg,#00c6ff,#00ff88);
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

#map {
  height:35vh;
}

button {
  width:100%;
  padding:12px;
  margin-top:6px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  font-size:14px;
}

.card {
  background:#111c2e;
  margin:10px;
  padding:15px;
  border-radius:12px;
}

.best {
  border:2px solid #00ff88;
  box-shadow:0 0 10px #00ff88;
}

.fav {
  background:#ffd700;
  color:black;
}
</style>

</head>

<body>

<header>🚀 Diesel AI GOD MODE</header>

<div id="map"></div>

<button onclick="subscribePush()">🔔 Push aktivieren</button> <button onclick="testPush()">🔥 Test Push</button> <button onclick="load()">🔄 Aktualisieren</button>

<div id="list"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// =============================
// SERVICE WORKER
// =============================
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}

// =============================
// PUSH SETUP
// =============================
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding)
    .replace(/-/g, '+')
    .replace(/_/g, '/');

  const rawData = window.atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

async function subscribePush(){

  const reg = await navigator.serviceWorker.ready;

  const sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64ToUint8Array("BF4IqXqPv0zbao4xRksA2In8KFIaJ6v6Nn9VwcXamqc6gMq-YQLqnkK8CU4TGBkbx38CkjWSjnRrxGmW2J0g4")
  });

  await fetch('/.netlify/functions/push', {
    method:"POST",
    body: JSON.stringify({
      type:"subscribe",
      sub
    })
  });

  alert("Push aktiviert 🚀");
}

async function testPush(){
  await fetch('/.netlify/functions/push', {
    method:"POST",
    body: JSON.stringify({ type:"push" })
  });
}

// =============================
// MAP
// =============================
let map = L.map('map').setView([52.18,10.97],13);
let markers = [];

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// =============================
// FAVORITEN
// =============================
function getFavs(){
  return JSON.parse(localStorage.getItem("favs") || "[]");
}

function toggleFav(id){
  let favs = getFavs();
  if(favs.includes(id)){
    favs = favs.filter(f => f !== id);
  } else {
    favs.push(id);
  }
  localStorage.setItem("favs", JSON.stringify(favs));
  load();
}

// =============================
// GPS
// =============================
function getLocation(){
  return new Promise(resolve=>{
    navigator.geolocation.getCurrentPosition(
      pos => resolve({
        lat: pos.coords.latitude,
        lng: pos.coords.longitude
      }),
      () => resolve({lat:52.18,lng:10.97})
    );
  });
}

// =============================
// SMART SCORE
// =============================
function score(s){
  return (s.price * 0.7) + (s.dist * 0.3);
}

// =============================
// NAVIGATION
// =============================
function nav(lat,lng){
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`);
}

// =============================
// HISTORY (lokal)
// =============================
function saveHistory(id, price){
  let history = JSON.parse(localStorage.getItem("history") || "{}");
  if(!history[id]) history[id] = [];
  history[id].push({price, time: Date.now()});
  localStorage.setItem("history", JSON.stringify(history));
}

// =============================
// LOAD DATA
// =============================
async function load(){

  const loc = await getLocation();

  map.setView([loc.lat, loc.lng], 13);

  markers.forEach(m => map.removeLayer(m));
  markers = [];

  markers.push(L.marker([loc.lat, loc.lng]).addTo(map));

  const res = await fetch(`/.netlify/functions/api?lat=${loc.lat}&lng=${loc.lng}`);
  const data = await res.json();

  let stations = data.stations || data;

  stations.sort((a,b)=> score(a) - score(b));

  const favs = getFavs();

  const list = document.getElementById("list");
  list.innerHTML = "";

  stations.forEach((s,i)=>{

    saveHistory(s.id, s.price);

    const isFav = favs.includes(s.id);

    const div = document.createElement("div");
    div.className = "card";

    if(i === 0) div.classList.add("best");
    if(isFav) div.classList.add("fav");

    div.innerHTML = `
      ${i===0 ? "🏆 BESTER DEAL<br>" : ""}
      <b>${s.name}</b><br>
      ${s.place}<br>
      💰 ${s.price.toFixed(3)} €<br>
      📍 ${s.dist.toFixed(2)} km<br>

      <button onclick="nav(${s.lat},${s.lng})">🧭 Navigation</button>
      <button onclick="toggleFav('${s.id}')">${isFav ? "⭐ Entfernen" : "⭐ Favorit"}</button>
    `;

    list.appendChild(div);

    markers.push(
      L.marker([s.lat, s.lng]).addTo(map)
        .bindPopup(`${s.name}<br>${s.price}€`)
    );
  });

}

// =============================
// AUTO START
// =============================
load();
setInterval(load, 60000);

</script>

</body>
</html>
