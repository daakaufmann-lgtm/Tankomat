<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tankomat PRO</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family: system-ui;
  background: linear-gradient(180deg,#0b1220,#020617);
  color:white;
}

header {
  padding:16px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  background: linear-gradient(90deg,#00c6ff,#00ff88);
}

#map { height:220px; }

button {
  width:90%;
  margin:10px auto;
  display:block;
  padding:14px;
  border:none;
  border-radius:12px;
  background: linear-gradient(90deg,#00ff88,#00c6ff);
  color:#000;
  font-weight:bold;
}

.card {
  margin:12px;
  padding:16px;
  border-radius:16px;
  background:#111a2e;
}

.best { border:2px solid #00ff88; }
.favorite { border:2px solid gold; }

.price {
  font-size:20px;
  color:#00ff88;
}
</style>

</head>

<body>

<header>🚀 Tankomat PRO</header>

<div id="map"></div>
<button onclick="loadData()">🔄 Aktualisieren</button>

<div id="list">🔄 Lade Daten...</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const API_URL = "https://mtqnxdwbwpvdzrblxpsz.supabase.co/functions/v1/dynamic-worker";

let map;
let userLat;
let userLng;

let favorites = JSON.parse(localStorage.getItem("fav") || "[]");

// ⭐ Favoriten
function toggleFav(id){
  if(favorites.includes(id)){
    favorites = favorites.filter(f=>f!==id);
  } else {
    favorites.push(id);
  }
  localStorage.setItem("fav", JSON.stringify(favorites));
  loadData();
}

// 📍 Start
function start(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      initMap();
      loadData();
    }, fallback);
  } else fallback();
}

function fallback(){
  userLat = 52.18;
  userLng = 10.97;
  initMap();
  loadData();
}

// 🗺️ Map
function initMap(){
  map = L.map('map').setView([userLat,userLng], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
    .addTo(map);

  L.marker([userLat,userLng])
    .addTo(map)
    .bindPopup("📍 Du bist hier")
    .openPopup();
}

// 🔥 LOAD (ROBUST)
async function loadData(){

  const list = document.getElementById("list");

  if(!userLat || !userLng){
    list.innerHTML="📍 Warte auf Standort...";
    return;
  }

  list.innerHTML="🔄 Lade Tankstellen...";

  try{

    const url = `${API_URL}?lat=${userLat}&lng=${userLng}`;
    console.log("CALL:", url);

    const res = await fetch(url);

    if(!res.ok){
      throw new Error("HTTP Fehler " + res.status);
    }

    const data = await res.json();
    console.log("DATA:", data);

    // 👉 FIX: flexible Datenstruktur
    let stations = [];

    if(data.stations){
      stations = data.stations;
    } else if(data.station){
      stations = [data.station];
    }

    if(stations.length === 0){
      list.innerHTML="❌ Keine Daten empfangen";
      return;
    }

    render(stations);

  }catch(e){
    console.error(e);
    list.innerHTML = "❌ Fehler beim Laden<br><small>"+e.message+"</small>";
  }
}

// 🎨 RENDER
function render(stations){

  const list = document.getElementById("list");
  list.innerHTML="";

  stations.sort((a,b)=>{
    const favA = favorites.includes(a.id);
    const favB = favorites.includes(b.id);
    return favB - favA || a.price - b.price;
  });

  const best = stations[0];

  stations.slice(0,10).forEach(s=>{

    const price = s.price || s.diesel || "n/a";

    const div = document.createElement("div");

    div.className = "card "
      + (s.id===best.id ? "best " : "")
      + (favorites.includes(s.id) ? "favorite " : "");

    div.innerHTML = `
      ${s.id===best.id ? "🏆 BESTER PREIS<br><br>" : ""}

      <b>${s.name}</b><br>
      ${s.place}<br><br>

      <div class="price">⛽ ${price} €</div><br>

      📍 ${s.dist} km<br><br>

      <button onclick="nav(${s.lat},${s.lng})">🧭 Navigation</button>
      <button onclick="toggleFav('${s.id}')">
        ${favorites.includes(s.id) ? "⭐ Entfernen" : "⭐ Favorit"}
      </button>
    `;

    list.appendChild(div);

    L.marker([s.lat,s.lng]).addTo(map);
  });
}

// 🧭 NAV
function nav(lat,lng){
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`);
}

// SW
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}

// START
start();

</script>

</body>
</html>
