<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tankomat TEST</title>
</head>

<body style="background:#111;color:white;font-family:Arial">

<h2>Tankomat Test</h2>
<button onclick="loadData()">Laden</button>

<div id="list">Noch nichts geladen</div>

<script>

const API_URL = "https://mtqnxdwbwpvdzrblxpsz.supabase.co/functions/v1/dynamic-worker";

async function loadData(){
  const list = document.getElementById("list");
  list.innerHTML = "Lade...";

  try{
    const res = await fetch(API_URL + "?lat=52.18&lng=10.97");
    const data = await res.json();

    console.log(data);

    if(!data.stations){
      list.innerHTML = "❌ keine stations";
      return;
    }

    list.innerHTML = "";

    data.stations.forEach(s=>{
      const div = document.createElement("div");
      div.innerHTML = `
        <b>${s.name}</b><br>
        Preis: ${s.price} €<br><br>
      `;
      list.appendChild(div);
    });

  }catch(e){
    console.error(e);
    list.innerHTML = "❌ Fehler";
  }
}

</script>

</body>
</html>
