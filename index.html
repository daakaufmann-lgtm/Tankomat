<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tankomat ⛽</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b1220;
  color:white;
}

header {
  background: linear-gradient(90deg,#00c6ff,#00ff88);
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

#map {
  height:250px;
}

button {
  width:90%;
  margin:10px auto;
  display:block;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#00cc66;
  color:white;
  font-size:16px;
}

.card {
  background:#111a2e;
  margin:10px;
  padding:12px;
  border-radius:10px;
}

.best {
  border:2px solid #00ff88;
}
</style>

</head>

<body>

<header>⛽ Tankomat</header>

<div id="map"></div>

<button onclick="loadData()">🔄 Aktualisieren</button>

<div id="list"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map;
let userLat = 52.18;
let userLng = 10.97;

// 🔥 DEIN ECHTER KEY
const API_KEY = "1887fa92-8a53-462a-8efc-d124c14297a4";

function initMap() {
  map = L.map('map').setView([userLat, userLng], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);
}

async function loadData() {
  try {
    const res = await fetch(`https://creativecommons.tankerkoenig.de/json/list.php?lat=${userLat}&lng=${userLng}&rad=10&sort=price&type=all&apikey=${API_KEY}`);
    const data = await res.json();

    renderList(data.stations);
  } catch (e) {
    console.log(e);
  }
}

function renderList(stations) {
  const list = document.getElementById("list");
  list.innerHTML = "";

  if (!stations || stations.length === 0) return;

  let best = stations
    .filter(s => s.price)
    .sort((a,b)=>a.price-b.price)[0];

  stations.forEach(s => {
    const div = document.createElement("div");
    div.className = "card" + (best && s.id === best.id ? " best" : "");

    div.innerHTML = `
      <b>${s.name}</b><br>
      ${s.place}<br>
      Diesel: ${s.diesel || "-"} €<br>
      E5: ${s.e5 || "-"} €<br>
      E10: ${s.e10 || "-"} €<br>
      ${s.dist} km<br>
      <button onclick="navigate(${s.lat},${s.lng})">Navigation</button>
    `;

    list.appendChild(div);

    L.marker([s.lat, s.lng]).addTo(map);
  });
}

function navigate(lat,lng){
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`);
}

initMap();
loadData();
</script>

</body>
</html>
