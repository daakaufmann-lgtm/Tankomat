<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tankomat 🚀</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b1220;
  color:white;
}

header {
  background: linear-gradient(90deg,#00c6ff,#00ff88);
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

#map {
  height:250px;
}

button {
  width:90%;
  margin:8px auto;
  display:block;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#00cc66;
  color:white;
  font-size:16px;
}

.card {
  background:#111a2e;
  margin:10px;
  padding:12px;
  border-radius:10px;
  transition:0.3s;
}

.card:hover {
  transform:scale(1.02);
}

.best {
  border:2px solid #00ff88;
}

.favorite {
  border:2px solid gold;
}

.price-low { color:#00ff88; }
.price-mid { color:#ffaa00; }
.price-high { color:#ff4444; }
</style>

</head>

<body>

<header>🚀 Tankomat PRO</header>

<div id="map"></div>

<button onclick="loadData()">🔄 Aktualisieren</button>

<div id="list"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map;
let userLat = 52.18;
let userLng = 10.97;

const API_URL = "https://mtqnxdwbwpvdzrblxpsz.supabase.co/functions/v1/dynamic-worker";

// ⭐ FAVORITEN
let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");

function toggleFavorite(id){
  if(favorites.includes(id)){
    favorites = favorites.filter(f=>f!==id);
  } else {
    favorites.push(id);
  }
  localStorage.setItem("favorites", JSON.stringify(favorites));
  loadData();
}

// 📍 Standort
function getLocation(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      initMap();
      loadData();
    }, ()=>{
      initMap();
      loadData();
    });
  } else {
    initMap();
    loadData();
  }
}

// 🗺️ Map
function initMap(){
  map = L.map('map').setView([userLat, userLng], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  L.marker([userLat, userLng]).addTo(map)
    .bindPopup("📍 Du bist hier")
    .openPopup();
}

// 🔥 LOAD DATA
async function loadData(){
  const res = await fetch(`${API_URL}?lat=${userLat}&lng=${userLng}`);
  const data = await res.json();

  renderList(data.stations);
}

// 🎨 Preis Farbe
function getPriceClass(price){
  if(price < 2.10) return "price-low";
  if(price < 2.25) return "price-mid";
  return "price-high";
}

// 📦 LISTE
function renderList(stations){
  const list = document.getElementById("list");
  list.innerHTML = "";

  let best = stations.sort((a,b)=>a.price-b.price)[0];

  stations.forEach(s=>{
    const isFav = favorites.includes(s.id);

    const div = document.createElement("div");
    div.className = "card " 
      + (best.id === s.id ? "best " : "")
      + (isFav ? "favorite" : "");

    div.innerHTML = `
      <b>${s.name}</b><br>
      ${s.place}<br><br>

      ⛽ Preis: <span class="${getPriceClass(s.price)}">${s.price} €</span><br><br>

      📍 ${s.dist} km<br><br>

      <button onclick="navigate(${s.lat},${s.lng})">🧭 Navigation</button>
      <button onclick="toggleFavorite('${s.id}')">
        ${isFav ? "⭐ Entfernen" : "⭐ Favorit"}
      </button>
    `;

    list.appendChild(div);

    L.marker([s.lat, s.lng]).addTo(map);
  });
}

// 🧭 Navi
function navigate(lat,lng){
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`);
}

// 🔔 PUSH (Basic vorbereitet)
function requestPush(){
  if("Notification" in window){
    Notification.requestPermission().then(p=>{
      if(p === "granted"){
        new Notification("🚀 Tankomat aktiv!", {
          body:"Push funktioniert 😏"
        });
      }
    });
  }
}

getLocation();
</script>

</body>
</html>
