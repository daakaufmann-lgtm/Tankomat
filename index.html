<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tankomat ⛽</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b1220;
  color:white;
}

header {
  background: linear-gradient(90deg,#00c6ff,#00ff88);
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

#map {
  height:250px;
}

button {
  width:90%;
  margin:10px auto;
  display:block;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#00cc66;
  color:white;
  font-size:16px;
}

.card {
  background:#111a2e;
  margin:10px;
  padding:12px;
  border-radius:10px;
}

.best {
  border:2px solid #00ff88;
}
</style>

</head>

<body>

<header>⛽ Tankomat</header>

<div id="map"></div>

<button onclick="loadData()">🔄 Aktualisieren</button>

<div id="list"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map;
let userLat = 52.18;
let userLng = 10.97;

// 🔥 DEINE SUPABASE FUNCTION
const API_URL = "https://mtqnxdwbwpvdzrblxpsz.supabase.co/functions/v1/dynamic-worker";

// 📍 Standort holen
function getLocation(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      initMap();
      loadData();
    }, ()=>{
      initMap();
      loadData();
    });
  } else {
    initMap();
    loadData();
  }
}

// 🗺️ Karte starten
function initMap(){
  map = L.map('map').setView([userLat, userLng], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  L.marker([userLat, userLng]).addTo(map)
    .bindPopup("📍 Du bist hier")
    .openPopup();
}

// 🔥 Daten laden (jetzt korrekt!)
async function loadData(){
  try{
    const res = await fetch(`${API_URL}?lat=${userLat}&lng=${userLng}`);
    const data = await res.json();

    renderList(data.stations);

  }catch(e){
    console.error("FEHLER:", e);
  }
}

// 📦 Liste anzeigen
function renderList(stations){
  const list = document.getElementById("list");
  list.innerHTML = "";

  if(!stations || stations.length === 0){
    list.innerHTML = "❌ Keine Daten";
    return;
  }

  // günstigste finden
  let best = stations.sort((a,b)=>a.price-b.price)[0];

  stations.forEach(s=>{
    const div = document.createElement("div");
    div.className = "card" + (best && s.id === best.id ? " best" : "");

    div.innerHTML = `
      <b>${s.name}</b><br>
      ${s.place}<br><br>

      ⛽ Preis: ${s.price ?? "-"} €<br><br>

      📍 ${s.dist} km<br><br>

      <button onclick="navigate(${s.lat},${s.lng})">🧭 Navigation</button>
    `;

    list.appendChild(div);

    L.marker([s.lat, s.lng]).addTo(map);
  });
}

// 🧭 Navigation
function navigate(lat,lng){
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`);
}

// 🚀 Start
getLocation();
</script>

</body>
</html>
