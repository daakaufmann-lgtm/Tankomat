<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tankomat PRO 🚀</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; background:#0b1220; color:white; }
header { background:linear-gradient(90deg,#00c6ff,#00ff88); padding:15px; text-align:center; font-weight:bold; }
#map { height:250px; }
button { width:90%; margin:10px auto; display:block; padding:12px; background:#00cc66; border:none; border-radius:8px; color:white; }
.card { background:#111a2e; margin:10px; padding:12px; border-radius:10px; }
.error { color:red; padding:10px; }
</style>

</head>

<body>

<header>🚀 Tankomat PRO</header>

<div id="map"></div>
<button onclick="loadData()">🔄 Aktualisieren</button>

<div id="list">🔄 Lade...</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map;
let userLat = 52.18;
let userLng = 10.97;

const API_URL = "https://mtqnxdwbwpvdzrblxpsz.supabase.co/functions/v1/dynamic-worker";

// MAP
function initMap(){
  map = L.map('map').setView([userLat, userLng], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  L.marker([userLat, userLng]).addTo(map).bindPopup("Du bist hier").openPopup();
}

// GEO
function getLocation(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      initMap();
      loadData();
    }, ()=>{
      initMap();
      loadData();
    });
  } else {
    initMap();
    loadData();
  }
}

// LOAD
async function loadData(){
  const list = document.getElementById("list");
  list.innerHTML = "🔄 Lade Tankstellen...";

  try{
    const url = `${API_URL}?lat=${userLat}&lng=${userLng}`;
    console.log("CALL:", url);

    const res = await fetch(url);

    if(!res.ok){
      throw new Error("HTTP Fehler: " + res.status);
    }

    const data = await res.json();
    console.log("DATA:", data);

    // FLEXIBLE CHECK
    const stations = data.stations || (data.station ? [data.station] : []);

    if(stations.length === 0){
      list.innerHTML = "❌ Keine Daten im JSON";
      return;
    }

    renderList(stations);

  }catch(e){
    console.error(e);
    list.innerHTML = `<div class="error">❌ Fehler:<br>${e.message}</div>`;
  }
}

// RENDER
function renderList(stations){
  const list = document.getElementById("list");
  list.innerHTML = "";

  stations.slice(0,10).forEach(s=>{

    const price = s.price || s.diesel || "nicht verfügbar";

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>${s.name}</b><br>
      ${s.place}<br><br>

      ⛽ Preis: ${price} €<br>
      📍 ${s.dist} km<br><br>

      <button onclick="navigate(${s.lat},${s.lng})">Navigation</button>
    `;

    list.appendChild(div);

    if(map){
      L.marker([s.lat, s.lng]).addTo(map);
    }
  });
}

// NAV
function navigate(lat,lng){
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`);
}

// START
getLocation();

</script>

</body>
</html>
