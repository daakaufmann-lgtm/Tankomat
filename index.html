<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tankomat PRO 🚀</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b1220;
  color:white;
}

header {
  background: linear-gradient(90deg,#00c6ff,#00ff88);
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

#map {
  height:250px;
}

button {
  width:90%;
  margin:8px auto;
  display:block;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#00cc66;
  color:white;
  font-size:16px;
}

.card {
  background:#111a2e;
  margin:10px;
  padding:12px;
  border-radius:10px;
  transition:0.3s;
}

.card:hover { transform:scale(1.02); }

.best { border:2px solid #00ff88; }
.favorite { border:2px solid gold; }

.price-low { color:#00ff88; }
.price-mid { color:#ffaa00; }
.price-high { color:#ff4444; }
</style>

</head>

<body>

<header>🚀 Tankomat PRO</header>

<div id="map"></div>

<button onclick="loadData()">🔄 Aktualisieren</button>

<div id="list"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map;
let userLat = 52.18;
let userLng = 10.97;

const API_URL = "https://mtqnxdwbwpvdzrblxpsz.supabase.co/functions/v1/dynamic-worker";

// ⭐ Favoriten
let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");

function toggleFavorite(id){
  if(favorites.includes(id)){
    favorites = favorites.filter(f=>f!==id);
  } else {
    favorites.push(id);
  }
  localStorage.setItem("favorites", JSON.stringify(favorites));
  loadData();
}

// 📍 Standort
function getLocation(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      initMap();
      loadData();
    }, ()=>{
      initMap();
      loadData();
    });
  } else {
    initMap();
    loadData();
  }
}

// 🗺️ Karte
function initMap(){
  map = L.map('map').setView([userLat, userLng], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  L.marker([userLat, userLng]).addTo(map)
    .bindPopup("📍 Du bist hier")
    .openPopup();
}

// 🔥 Daten laden + Details holen
async function loadData(){
  const res = await fetch(`${API_URL}?lat=${userLat}&lng=${userLng}`);
  const data = await res.json();

  // 🔥 jetzt für jede Tankstelle Details holen
  for (let s of data.stations.slice(0, 10)) {
    try {
      const detailRes = await fetch(`${API_URL}&detail=${s.id}`);
      const detail = await detailRes.json();

      if(detail.station){
        s.diesel = detail.station.diesel;
        s.e5 = detail.station.e5;
        s.e10 = detail.station.e10;
      }
    } catch(e){}
  }

  renderList(data.stations);
}

// 🎨 Preisfarbe
function getPriceClass(price){
  if(!price) return "";
  if(price < 2.10) return "price-low";
  if(price < 2.25) return "price-mid";
  return "price-high";
}

// 📦 Liste
function renderList(stations){
  const list = document.getElementById("list");
  list.innerHTML = "";

  stations.sort((a,b)=>{
    const aFav = favorites.includes(a.id);
    const bFav = favorites.includes(b.id);
    return bFav - aFav || a.price - b.price;
  });

  let best = stations[0];

  stations.forEach(s=>{
    const isFav = favorites.includes(s.id);

    const div = document.createElement("div");
    div.className = "card "
      + (best.id === s.id ? "best " : "")
      + (isFav ? "favorite" : "");

    div.innerHTML = `
      ${best.id === s.id ? "🏆 BESTER PREIS<br><br>" : ""}

      <b>${s.name}</b><br>
      ${s.place}<br><br>

      ⛽ Diesel: <span class="${getPriceClass(s.diesel)}">${s.diesel ?? "-"} €</span><br>
      🟢 E5: ${s.e5 ?? "-"} €<br>
      🔵 E10: ${s.e10 ?? "-"} €<br><br>

      📍 ${s.dist} km<br><br>

      <button onclick="navigate(${s.lat},${s.lng})">🧭 Navigation</button>
      <button onclick="toggleFavorite('${s.id}')">
        ${isFav ? "⭐ Entfernen" : "⭐ Favorit"}
      </button>
    `;

    list.appendChild(div);

    L.marker([s.lat, s.lng]).addTo(map);
  });
}

// 🧭 Navigation
function navigate(lat,lng){
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`);
}

// 🔔 Push Test
function requestPush(){
  if("Notification" in window){
    Notification.requestPermission().then(p=>{
      if(p === "granted"){
        new Notification("🚀 Tankomat aktiv!");
      }
    });
  }
}

// 🔄 Auto Refresh
setInterval(loadData, 60000);

getLocation();
</script>

</body>
</html>

</html>
